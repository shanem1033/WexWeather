# Render Blueprint: the API as a free web service, reading from Neon.
services:
  - type: web
    name: wexweather-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Render tells the app which port to listen on through $PORT.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Deploy a push to main only once its GitHub checks (the tests) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      # Entered in the Render dashboard on first deploy, never committed.
      - key: DATABASE_URL
        sync: false
