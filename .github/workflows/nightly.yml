name: Nightly forecast

on:
  schedule:
    # Cron here is always UTC. Scheduled runs can start hours late (one ran
    # at 02:46 instead of 22:00), and the job works out its dates when it
    # starts, so a run that slips past midnight acts as the next night's.
    # 20:17 leaves nearly four hours of slack, and avoiding the top of the
    # hour dodges the busiest time for GitHub's scheduler.
    - cron: "17 20 * * *"
  # Adds a "Run workflow" button in the Actions tab for running it by hand.
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m scripts.fetch_forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
